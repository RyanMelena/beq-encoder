[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "beq-encoder"
version = "0.1.0"
description = "Add a bass-EQ (BEQ) copy of a film's best audio track to the same MKV"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "numpy>=2.0",
    "scipy>=1.13",
    "pymediainfo>=7.0.1",
    "guessit>=3.8",
    "matplotlib>=3.9",
    "watchfiles>=1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
beq-encoder = "beq_encoder.__main__:main"
beq-filter-caf = "beq_encoder.beqfilter:main"

[tool.setuptools.packages.find]
include = ["beq_encoder*"]

[tool.setuptools.package-data]
beq_encoder = ["templates/*.html", "static/*"]
